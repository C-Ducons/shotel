<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Eliminar Habitación</title>
</head>

<body>
    <h1>Eliminar Habitación</h1>
    <form id="deleteForm" method="POST"
        onsubmit="this.action='/habitaciones/' + document.getElementById('habitacionId').value;">
        <input type="hidden" name="_method" value="DELETE" />
        <label for="habitacionId">ID de la Habitación a eliminar: </label>
        <input type="number" id="habitacionId" placeholder="Ej: 1" required />
        <button type="submit">Eliminar Habitación</button>
    </form>
</body>

</html>
