<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nueva Habitación</title>
</head>

<body>
    <h1>Crear Habitación</h1>
    <form action="/habitaciones" method="post">
        <label for="numero">Número:</label>
        <input type="text" id="numero" name="numero" required>
        <br><br>

        <label for="tipo">Tipo:</label>
        <select id="tipo" name="tipo" required>
            <option value="">-- Selecciona un tipo --</option>
            <option value="Individual">Individual</option>
            <option value="Doble Domótica">Doble Domótica</option>
            <option value="Suite Automatizada">Suite Automatizada</option>
        </select>
        <br><br>

        <label for="temperatura">Temperatura (°C):</label>
        <input type="number" id="temperatura" name="temperatura" step="0.5" required>
        <br><br>

        <label for="precio">Precio (€):</label>
        <input type="number" id="precio" name="precio" step="0.01" min="0" required>
        <br><br>

        <button type="submit">Crear Habitación</button>
    </form>
</body>

</html>
