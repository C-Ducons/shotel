<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Habitación</title>
</head>

<body>
    <h1>Editar Habitación</h1>
    <form id="editForm" method="POST"
        onsubmit="this.action='/habitaciones/' + document.getElementById('habitacionId').value;">
        <input type="hidden" name="_method" value="PUT" />

        <label for="habitacionId">ID de la Habitación a modificar:</label>
        <input type="number" id="habitacionId" placeholder="Ej: 1" required>
        <br><br>

        <label for="numero">Número (para pasar validación):</label>
        <input type="text" id="numero" name="numero" placeholder="Ej: 101" required>
        <br><br>

        <label for="tipo">Nuevo Tipo:</label>
        <select id="tipo" name="tipo" required>
            <option value="">-- Selecciona un tipo --</option>
            <option value="Individual">Individual</option>
            <option value="Doble Domótica">Doble Domótica</option>
            <option value="Suite Automatizada">Suite Automatizada</option>
        </select>
        <br><br>

        <label for="temperatura">Nueva Temperatura (°C):</label>
        <input type="number" id="temperatura" name="temperatura" step="0.5" required>
        <br><br>

        <label for="precio">Nuevo Precio (€):</label>
        <input type="number" id="precio" name="precio" step="0.01" min="0" required>
        <br><br>

        <button type="submit">Modificar Habitación</button>
    </form>
</body>

</html>
